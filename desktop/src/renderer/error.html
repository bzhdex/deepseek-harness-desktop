<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness — 出错了</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #0f1014;
      color: #e6e6ea;
      display: grid; place-items: center;
      padding: 32px;
    }
    .card {
      max-width: 560px; width: 100%;
      background: #181a20;
      border: 1px solid #26282f;
      border-radius: 16px;
      padding: 36px 34px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .title .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5c5c; }
    p { font-size: 14px; line-height: 1.6; color: #b9bac2; }
    pre {
      font-size: 12px; color: #8a8a94; background: #101114;
      border: 1px solid #26282f; border-radius: 8px;
      padding: 12px; white-space: pre-wrap; word-break: break-all;
      max-height: 180px; overflow: auto;
    }
    .actions { display: flex; gap: 12px; }
    button {
      appearance: none; border: none; cursor: pointer;
      font-size: 14px; font-weight: 500;
      padding: 10px 18px; border-radius: 8px;
    }
    .primary { background: #4d7cfe; color: #fff; }
    .primary:hover { background: #3f6ceb; }
    .ghost { background: transparent; color: #b9bac2; border: 1px solid #33353d; }
    .ghost:hover { background: #202228; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title"><span class="dot"></span>无法连接到 DeepSeek Harness</div>
    <p>
      本地服务未能启动或已停止。请检查网络/端口占用情况后重试；
      如果问题持续，请查看日志目录
      <code>%APPDATA%\DeepSeek Harness\desktop\logs</code>。
    </p>
    <pre id="detail">正在读取错误详情…</pre>
    <div class="actions">
      <button class="primary" id="retry">重试</button>
      <button class="ghost" id="quit">退出</button>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var detail = params.get('detail');
    document.getElementById('detail').textContent = detail || '（无详细错误信息）';
    document.getElementById('retry').addEventListener('click', function () {
      if (window.dshDesktop && window.dshDesktop.restart) window.dshDesktop.restart();
    });
    document.getElementById('quit').addEventListener('click', function () {
      if (window.dshDesktop && window.dshDesktop.quit) window.dshDesktop.quit();
      else window.close();
    });
  </script>
</body>
</html>

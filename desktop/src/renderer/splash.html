<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #0f1014;
      color: #e6e6ea;
      display: grid;
      place-items: center;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .mark {
      width: 84px; height: 84px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4d7cfe 0%, #7a5cff 100%);
      display: grid; place-items: center;
      font-weight: 700; font-size: 34px; color: #fff;
      box-shadow: 0 12px 40px rgba(90, 110, 255, .35);
    }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: .3px; }
    .spinner {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #7a9bff;
      animation: spin 0.9s linear infinite;
    }
    .hint { font-size: 13px; color: #8a8a94; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="mark">H</div>
    <h1>DeepSeek Harness</h1>
    <div class="spinner"></div>
    <div class="hint">正在启动本地服务…</div>
  </div>
</body>
</html>
